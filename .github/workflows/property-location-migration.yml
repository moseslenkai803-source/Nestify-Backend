name: Property Location Migration Upgrade

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-location-migration:
    name: property-location-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_MIGRATION_TESTS: "1"
      DATABASE_URL: "postgresql+psycopg://unused:unused@127.0.0.1:1/nestify_pytest"
      JWT_SECRET_KEY: "ci-only-test-secret"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run property-location migration upgrade test
        run: python -m pytest -q tests/migrations/test_property_location_migration_upgrade.py
